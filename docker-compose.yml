services:

  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

    depends_on:
      - db
      - provider

  provider:
    build: .
    command: uvicorn fake_provider.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

  prometheus:
    image: prom/prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./golden-path/slo/output:/etc/prometheus/rules

    depends_on:
      - app


  grafana:
    image: grafana/grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus
